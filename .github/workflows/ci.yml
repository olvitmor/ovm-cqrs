on: 
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          global-json-file: global.json

      - run: ./build.sh ./artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
